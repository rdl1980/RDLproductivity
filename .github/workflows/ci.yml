name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rdl:rdl@localhost:5432/rdlproductivity
      AUTH_SECRET: ci-only-auth-secret-not-used-in-production
      # Matches the e2e session cookie, so MCP access tokens are accepted.
      ALLOWED_EMAIL: e2e@example.com
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rdl
          POSTGRES_PASSWORD: rdl
          POSTGRES_DB: rdlproductivity
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations and seed
        run: pnpm prisma migrate deploy && pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
